[package]
name = "audiovis"
version = "0.2.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.18.2"
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
egui-wgpu = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
midir = "0.11.0"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# A copy of egui-wgpu with two small changes for HDR output: it can pick a
# 16-bit float surface, and draws the interface at a set brightness on one.
# Search the copy for "AudioVis" to find them.
[patch.crates-io]
egui-wgpu = { path = "vendor/egui-wgpu" }
