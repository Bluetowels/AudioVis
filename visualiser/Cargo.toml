[package]
name = "audiovis"
version = "0.3.0"
edition = "2024"

# The app is a library with a small program wrapped round it, because Android
# loads an app as a shared library rather than running a program.
# android/build-native.sh builds that with `cargo rustc --lib --crate-type cdylib`.
[lib]
name = "audiovis"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
egui-wgpu = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
midir = "0.11.0"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(not(target_os = "android"))'.dependencies]
cpal = "0.18.2"
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }

# Lyrics. What is playing (title, artist, position) comes from Windows'
# media controls, and the lyrics are fetched from lrclib.net over Windows'
# own TLS.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Media_Control", "Foundation", "Graphics_Imaging", "Storage_Streams"] }
ureq = { version = "3.4.2", default-features = false, features = ["native-tls"] }

# Android: sound arrives from the Java side of the app (see android/), and
# the screen reader support in eframe needs a different kind of activity.
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["native-activity"] }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "android-native-activity"] }
jni = "0.21.1"

# A copy of egui-wgpu with two small changes for HDR output: it can pick a
# 16-bit float surface, and draws the interface at a set brightness on one.
# Search the copy for "AudioVis" to find them.
[patch.crates-io]
egui-wgpu = { path = "vendor/egui-wgpu" }
