# Builds the Android app (an APK to copy to a phone and install), then starts
# it in an emulator and keeps a screenshot. Runs when the app or its
# packaging changes, on a version tag, or when started by hand
# (Actions > Android build > Run workflow).
name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main, android-port]
    tags: ['v*']
    paths:
      - 'visualiser/**'
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust targets
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: visualiser

      - name: Build the Rust library
        run: bash android/build-native.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # With the four ANDROID_KEY... secrets set, every build is signed with
      # the same key and installs over the last one. Without them the APK is
      # signed with a throwaway key.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/audiovis.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/audiovis.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build the APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p android --no-daemon assembleRelease
          version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' visualiser/Cargo.toml | head -n 1)"
          mkdir -p android/output
          cp android/app/build/outputs/apk/release/app-release.apk "android/output/AudioVis-$version.apk"
          ls -l android/output

      - uses: actions/upload-artifact@v4
        with:
          name: AudioVis-Android
          path: android/output/*.apk
          if-no-files-found: error

  # Installs the APK in an emulator, starts it (a first run shows the test
  # signal) and saves what is on the screen. An emulator's graphics are not
  # a real phone's, so a failure here is reported without failing the build.
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: AudioVis-Android
          path: apk

      - name: Let the emulator use hardware virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the app in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash android/emulator-test.sh apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AudioVis-Android-emulator
          path: |
            emulator.png
            emulator-late.png
            emulator.txt
          if-no-files-found: warn
